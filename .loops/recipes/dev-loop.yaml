version: 2

loops:
  - taskId: dev-preflight
    intervalHuman: 20m
    description: >
      Main dev loop: preflight → pick issue → implement → verify.
      Verification and PR CI failures get dedicated repair passes. All PRs
      squash-merge only after every required PR check passes; otherwise they
      wait for human review.

tasks:
  - id: dev-preflight
    name: "Preflight: clean tree + sync main"
    command: sh
    commandArgs:
      - -c
      - >
        test -z "$(git status --porcelain)"
        && git switch main
        && git fetch origin
        && git rebase origin/main
    onSuccessTaskId: dev-pick
    onFailureTaskId: dev-clean-dirty

  - id: dev-clean-dirty
    name: "Recovery: dirty tree, reset and return to main"
    command: sh
    commandArgs:
      - -c
      - >
        git reset --hard && git clean -fd
        && git switch main
        && git fetch origin
        && git rebase origin/main
    onSuccessTaskId: dev-pick
    onFailureTaskId: null
    maxRuns: 1

  - id: dev-pick
    name: "Select and reserve oldest code:pick issue"
    command: sh
    commandArgs:
      - -c
      - >
        number=$(gh issue list --label "code:pick" --state open --limit 1000
        --json number --jq "sort_by(.number) | .[0].number");
        test -n "$number" || exit 75;
        body=$(gh issue view "$number" --json number,title,body
        --jq "{number,title,body}");
        gh issue edit "$number" --add-label code:doing
        --remove-label code:pick >/dev/null;
        printf "%s\n" "$body"
    onSuccessTaskId: dev-implement
    onFailureTaskId: dev-nothing

  - id: dev-implement
    name: "Implement: opencode /plan-goal"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        /plan-goal Issue title: {{title}} Issue body: {{body}}
        Issue id: {{number}}. Create a feature branch on git and work on this.
        Before finishing, run /repo-verify to derive, run, and repair every
        applicable current-branch check.
        Archive the completed change and generate visual evidence,
        then stop on the feature branch. Do not merge the feature branch
        into main, switch to main, push, or perform any GitHub actions.
        Never ask for confirmation.
    onSuccessTaskId: dev-verify
    onFailureTaskId: dev-fail

  - id: dev-verify
    name: "Verify: lint + typecheck + tests + build"
    command: sh
    commandArgs:
      - -c
      - >
        openspec list --json | python3 -c
        "import json,sys; sys.exit(bool(json.load(sys.stdin).get('changes', [])))"
        && rtk proxy pnpm typecheck
        && rtk proxy pnpm test
        && rtk proxy pnpm build
    onSuccessTaskId: dev-commit
    onFailureTaskId: dev-fix
    maxRuns: 5

  - id: dev-fix
    name: "Fix: resolve verification failures"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        First, load all skills available for your current agent.
        Verification failed on the current issue branch.
        Previous task output: {{output}}.
        Fix everything on the same branch.
        After each fix, rerun openspec list --json (must report no pending
        changes), rtk proxy pnpm typecheck,
        rtk proxy pnpm test, and rtk proxy pnpm build.
        Do not stop until all commands exit 0. Commit the fixes once verified.
        Do not push or perform any GitHub actions. Never ask for confirmation.
        Archive the completed change and generate visual evidence.
    onSuccessTaskId: dev-verify
    onFailureTaskId: dev-fail

  - id: dev-commit
    name: "Stage and commit all changes"
    command: sh
    commandArgs:
      - -c
      - 'git add -A && git commit -m "fix: resolve #{{number}} {{title}}" || true'
    onSuccessTaskId: dev-pr
    onFailureTaskId: null

  - id: dev-pr
    name: "Create PR; wait for CI before merge"
    command: sh
    commandArgs:
      - -c
      - >
        BRANCH=$(git branch --show-current)
        && git push -u origin "$BRANCH" >/dev/null
        && PR_URL=$(gh pr create --title "Resolve #{{number}}: {{title}}"
        --body "Closes #{{number}}" --label code:done)
        && printf '{"prUrl":"%s"}\n' "$PR_URL"
    onSuccessTaskId: dev-await-ci
    onFailureTaskId: dev-fail-merge

  - id: dev-await-ci
    name: "Wait for every required PR check"
    command: sh
    commandArgs:
      - -c
      - 'gh pr checks "{{prUrl}}" --required --watch --fail-fast'
    onSuccessTaskId: dev-ci-ready
    onFailureTaskId: dev-ci-fix
    maxRuns: 3

  - id: dev-ci-fix
    name: "Fix: resolve failed PR CI checks"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        First, load all skills available for your current agent. Required PR
        checks failed for {{prUrl}} on the current issue branch. Check output:
        {{output}}. Inspect every failed check and its GitHub Actions logs with
        gh pr checks and gh run view. Fix only actionable repository defects.
        Never disable, weaken, bypass, or lower CI, coverage, security, lint,
        test, or build gates to make a check pass. Do not change GitHub Actions
        merely to hide a failure. Run the relevant local checks and then the
        full repository verification required by /repo-verify. Commit and push
        every verified fix to the existing PR branch. After a successful push,
        post one concise PR comment naming failed checks, the fixes made, and
        local verification run. Do not merge the PR, close the issue, or change
        issue labels. If the failure is transient,
        external, or cannot be fixed safely in this repository, exit non-zero
        without pushing speculative changes. Never ask for confirmation.
    onSuccessTaskId: dev-await-ci
    onFailureTaskId: dev-ci-blocked

  - id: dev-ci-ready
    name: "Merge PR after CI passes"
    command: sh
    commandArgs:
      - -c
      - 'gh pr merge "{{prUrl}}" --squash --delete-branch --admin'
    onSuccessTaskId: dev-complete
    onFailureTaskId: dev-fail-merge

  - id: dev-ci-blocked
    name: "Recovery: leave CI-blocked PR for review"
    command: sh
    commandArgs:
      - -c
      - >
        gh issue edit {{number}} --add-label code:review
        --remove-label code:doing
        && git checkout -- . && git clean -fd && git switch main
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: dev-complete
    name: "Finalize issue and return to main"
    command: sh
    commandArgs:
      - -c
      - >
        gh issue edit {{number}} --add-label code:done
        --remove-label code:doing --remove-label code:review
        && gh issue close {{number}}
        && git checkout -- . && git clean -fd && git switch main
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: dev-fail-merge
    name: "Recovery: retry merge, otherwise leave for review"
    command: sh
    commandArgs:
      - -c
      - >
        BRANCH=$(git branch --show-current 2>/dev/null);
        if [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ]; then
        PR_URL=$(gh pr list --head "$BRANCH" --state open
        --json url --jq ".[0].url" 2>/dev/null);
        if [ -n "$PR_URL" ]; then
        gh pr merge "$PR_URL" --squash --delete-branch --admin
        && exit 0; fi; fi;
        gh issue edit {{number}} --add-label code:review
        --remove-label code:doing
        && git checkout -- . && git clean -fd && git switch main
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: dev-fail
    name: "Recovery: reset hard + relabel issue for human review"
    command: sh
    commandArgs:
      - -c
      - >
        git reset --hard && git clean -fd && git switch main
        && gh issue edit {{number}} --add-label code:review
        --remove-label code:doing
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: dev-nothing
    name: "No tasks to pick"
    command: echo
    commandArgs:
      - "Nothing to do, no issues with code:pick label"
    silentChain: true
    onSuccessTaskId: null
    onFailureTaskId: null

diagram: |
  flowchart TD
      devStart("Start<br/>Begin development cycle") --> devPreflight
      devPreflight["Preflight<br/>Clean tree + sync main"] -->|✓| devPick
      devPreflight -.->|✗| devCleanDirty
      devCleanDirty("Recovery<br/>Reset dirty tree + resync (maxRuns=1)") -->|✓| devPick
      devPick["Select<br/>Oldest code:pick issue"] -->|✓| devImplement
      devPick -.->|✗| devNothing
      devImplement("Implement<br/>AI: opencode /plan-goal") -->|✓| devVerify
      devImplement -.->|✗| devFail
      devVerify["Verify<br/>Typecheck + tests + build<br/>↻5"] -->|✓| devCommit
      devVerify -.->|✗| devFix
      devFix("Fix<br/>Resolve verification failures") -->|✓| devVerify
      devFix -.->|✗| devFail
      devCommit("Commit<br/>Stage and commit changes") -->|✓| devPr
      devPr["PR<br/>Push + create pull request"] -->|✓| devAwaitCi
      devPr -.->|✗| devFailMerge
      devAwaitCi["Check CI<br/>Wait for every required check<br/>↻3"] -->|✓| devCiReady
      devAwaitCi -.->|✗| devCiFix
      devCiFix("Fix CI<br/>Push fix and post PR note") -->|✓| devAwaitCi
      devCiFix -.->|✗| devCiBlocked
      devCiReady["Merge PR<br/>Squash and delete branch"] -->|✓| devComplete
      devCiReady -.->|✗| devFailMerge
      devComplete(("Complete<br/>Close issue + return to main"))
      devFailMerge(("Merge Fail<br/>Admin merge or leave for review"))
      devFail(("Fail<br/>Reset + relabel for review"))
      devCiBlocked(("CI Blocked<br/>Leave PR for human review"))
      devNothing(("Idle<br/>No issues to pick"))
      classDef start fill:#ffffff,stroke:#172033,stroke-width:2px,color:#172033
      classDef action fill:#eef0ff,stroke:#554cff,stroke-width:2px,color:#172033
      classDef decision fill:#fff8e8,stroke:#c75b00,stroke-width:2px,color:#172033
      classDef idle fill:#202c40,stroke:#738198,stroke-width:2px,color:#ffffff
      classDef failure fill:#fff0f0,stroke:#ef2929,stroke-width:2px,color:#8b1a1a
      classDef success fill:#e8f8ec,stroke:#18883c,stroke-width:2px,color:#145a32
      class devStart start
      class devCleanDirty,devImplement,devFix,devCommit,devCiFix action
      class devPreflight,devPick,devVerify,devPr,devAwaitCi,devCiReady decision
      class devNothing idle
      class devFail,devFailMerge,devCiBlocked failure
      class devComplete success
