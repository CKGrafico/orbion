version: 2

loops:
  - taskId: audit-preflight
    intervalHuman: 12h
    description: >
      Guardrails audit loop: preflight, lock, audit random area of the Orbion
      project, verify issues created, cleanup on failure
    maxRuns: null

tasks:
  - id: audit-preflight
    name: "Preflight: clean tree + sync main"
    command: sh
    commandArgs:
      - -c
      - >
        test -z "$(git status --porcelain)"
        && git switch main
        && git fetch origin
        && git rebase origin/main
    onSuccessTaskId: audit-lock
    onFailureTaskId: null
    maxRuns: 3

  - id: audit-lock
    name: "Check no audit already running"
    command: sh
    commandArgs:
      - -c
      - >
        count=$(gh issue list --label "audit:doing" --state open
        --limit 1 --json number --jq 'length');
        test "$count" -eq 0 || exit 75
    onSuccessTaskId: audit-audit
    onFailureTaskId: audit-nothing
    maxRuns: 3

  - id: audit-audit
    name: "AI: audit random area against guardrails"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        First, load all skills available for your current agent. Then audit
        a random area of the Orbion project (at src/renderer/, src/main/,
        src/preload/, or src/shared/). Load @ob-guardrails-project and
        @ob-guardrails-generic. Find at least 6 problems, score each 1-10.
        For the top 3, create GitHub issues with labels 'bug' and 'code:pick'
        using gh issue create (do NOT use /plan-story). Skip duplicates.
        Create a summary issue with label 'audit:report' listing all findings.
        Link each created issue as a sub-issue of the summary report.
        Do not modify code, push, or ask for confirmation. Never explore
        outside the repository root.
    onSuccessTaskId: audit-verify
    onFailureTaskId: audit-fail
    maxRuns: 3

  - id: audit-verify
    name: "Verify: at least 1 new bug issue created"
    command: sh
    commandArgs:
      - -c
      - >
        count=$(gh issue list --label "bug" --state open --limit 100
        --json number,createdAt
        --jq '[.[] | select(.createdAt > (now - 3600 | todate))] | length');
        test "$count" -gt 0
        && git checkout -- . && git clean -fd && exit 0 || exit 1
    onSuccessTaskId: null
    onFailureTaskId: audit-audit
    maxRuns: 3

  - id: audit-fail
    name: "Recovery: cleanup audit:doing state"
    command: sh
    commandArgs:
      - -c
      - >
        open_issues=$(gh issue list --label audit:doing --state open
        --json number --jq '.[].number');
        for id in $open_issues; do
        gh issue edit "$id" --remove-label audit:doing 2>/dev/null;
        done; git checkout -- . && git clean -fd; exit 0
    onSuccessTaskId: null
    onFailureTaskId: null
    maxRuns: 3

  - id: audit-nothing
    name: "Audit already in progress"
    command: echo
    commandArgs:
      - "Nothing to do - audit already in progress"
    silentChain: true
    onSuccessTaskId: null
    onFailureTaskId: null
    maxRuns: 3

diagram: |
  flowchart TD
      auditPreflight["Preflight<br/>Clean tree + sync main (maxRuns=3)"] -->|✓| auditLock
      auditLock["Check lock<br/>No audit already running (maxRuns=3)"] -->|✓| auditAudit
      auditLock -.->|✗| auditNothing
      auditAudit["AI: audit area<br/>Audit against guardrails + create issues (maxRuns=3)"] -->|✓| auditVerify
      auditAudit -.->|✗| auditFail
      auditVerify["Verify<br/>At least 1 new bug issue created (maxRuns=3)"] -->|✓| finalNode(("End"))
      auditVerify -.->|✗| auditAudit
      auditFail["Recovery<br/>Cleanup audit:doing state (maxRuns=3)"] -->|✓| finalNode(("End"))
      auditNothing["Idle<br/>Audit already in progress (maxRuns=3)"] -->|✓| finalNode(("End"))
      style auditPreflight fill:#e1f5fe
      class auditNothing silent
      classDef silent strokeDasharray:5 5,fill:#fef9e7
