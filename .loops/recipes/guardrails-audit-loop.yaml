version: 2

loops:
  - taskId: audit-preflight
    intervalHuman: 12h
    description: >
      Guardrails audit loop: preflight, lock, /repo-audit, publish findings,
      verify issues created, cleanup on failure
    maxRuns: null

tasks:
  - id: audit-preflight
    name: "Preflight: clean tree + sync main"
    command: sh
    commandArgs:
      - -c
      - >
        test -z "$(git status --porcelain)"
        && git switch main
        && git fetch origin
        && git rebase origin/main
    onSuccessTaskId: audit-lock
    onFailureTaskId: null

  - id: audit-lock
    name: "Check no audit already running"
    command: sh
    commandArgs:
      - -c
      - >
        count=$(gh issue list --label "audit:doing" --state open
        --limit 1 --json number --jq 'length');
        test "$count" -eq 0 || exit 75
    onSuccessTaskId: audit-audit
    onFailureTaskId: audit-nothing

  - id: audit-audit
    name: "AI: /repo-audit"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - /repo-audit
    onSuccessTaskId: audit-publish
    onFailureTaskId: audit-fail
    maxRuns: 3

  - id: audit-publish
    name: "AI: publish actionable audit findings"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        Use this read-only /repo-audit report from the previous task:
        {{output}}. Create GitHub issues with labels bug and code:pick for
        the three highest-severity actionable findings, skipping duplicates.
        Use /plan-story for each issue. Create one audit:report summary
        issue, link each created issue as a sub-issue, and preserve every
        dependency restore or immutable lockfile verification command from the
        report. Do not modify repository files, push, or ask for confirmation.
    onSuccessTaskId: audit-verify
    onFailureTaskId: audit-fail

  - id: audit-verify
    name: "Verify: at least 1 new bug issue created"
    command: sh
    commandArgs:
      - -c
      - >
        count=$(gh issue list --label "bug" --state open --limit 100
        --json number,createdAt
        --jq '[.[] | select(.createdAt > (now - 3600 | todate))] | length');
        test "$count" -gt 0
        && git checkout -- . && git clean -fd && exit 0 || exit 1
    onSuccessTaskId: null
    onFailureTaskId: audit-audit

  - id: audit-fail
    name: "Recovery: cleanup audit:doing state"
    command: sh
    commandArgs:
      - -c
      - >
        open_issues=$(gh issue list --label audit:doing --state open
        --json number --jq '.[].number');
        for id in $open_issues; do
        gh issue edit "$id" --remove-label audit:doing 2>/dev/null;
        done; git checkout -- . && git clean -fd; exit 0
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: audit-nothing
    name: "Audit already in progress"
    command: echo
    commandArgs:
      - "Nothing to do - audit already in progress"
    silentChain: true
    onSuccessTaskId: null
    onFailureTaskId: null

diagram: |
  flowchart TD
      auditStart("Start<br/>Begin guardrails audit cycle") --> auditPreflight
      auditPreflight["Preflight<br/>Clean tree + sync main"] -->|✓| auditLock
      auditPreflight -.->|✗| auditFail
      auditLock["Check lock<br/>No audit already running"] -->|✓| auditAudit
      auditLock -.->|✗| auditNothing
      auditAudit("AI: /repo-audit<br/>Read-only repository audit<br/>↻3") -->|✓| auditPublish
      auditAudit -.->|✗| auditFail
      auditPublish("AI: publish findings<br/>Create issues and audit report") -->|✓| auditVerify
      auditPublish -.->|✗| auditFail
      auditVerify["Verify<br/>At least 1 new bug issue created"] -->|✓| auditComplete
      auditVerify -.->|✗| auditAudit
      auditComplete(("Complete<br/>Audit finished successfully"))
      auditFail(("Fail<br/>Cleanup audit:doing state"))
      auditNothing(("Idle<br/>Audit already in progress"))
      classDef start fill:#ffffff,stroke:#172033,stroke-width:2px,color:#172033
      classDef action fill:#eef0ff,stroke:#554cff,stroke-width:2px,color:#172033
      classDef decision fill:#fff8e8,stroke:#c75b00,stroke-width:2px,color:#172033
      classDef idle fill:#202c40,stroke:#738198,stroke-width:2px,color:#ffffff
      classDef failure fill:#fff0f0,stroke:#ef2929,stroke-width:2px,color:#8b1a1a
      classDef success fill:#e8f8ec,stroke:#18883c,stroke-width:2px,color:#145a32
      class auditStart start
      class auditAudit,auditPublish action
      class auditPreflight,auditLock,auditVerify decision
      class auditNothing idle
      class auditFail failure
      class auditComplete success
