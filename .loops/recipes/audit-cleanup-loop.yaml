version: 2

loops:
  - taskId: audit-preflight
    intervalHuman: 1d
    description: "Audit cleanup loop: closes audit reports with no pending bugs"

tasks:
  - id: audit-preflight
    name: "Preflight: clean tree + sync main"
    command: sh
    commandArgs:
      - -c
      - >
        test -z "$(git status --porcelain)"
        && git switch main
        && git fetch origin
        && git rebase origin/main
    onSuccessTaskId: audit-select
    onFailureTaskId: null

  - id: audit-select
    name: "Select all open audit:report issues"
    command: sh
    commandArgs:
      - -c
      - >
        reports=$(gh issue list --label "audit:report" --state open
        --limit 1000 --json number,body --jq 'sort_by(.number)');
        test "$reports" != "[]" || exit 75;
        printf '%s\n' "$reports"
    onSuccessTaskId: audit-ai
    onFailureTaskId: audit-nothing

  - id: audit-ai
    name: "AI: check referenced issues and close report if all resolved"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        First, load all skills available for your current agent. You are an
        audit report cleanup agent. The previous task output is a JSON array
        of open audit reports, each with number and body: {{output}}. Process
        every report in that array. Extract every #NNN issue reference from
        each report body and check its state using gh issue view NUMBER --json
        state. If all referenced issues are closed, or the report has no
        referenced issues, close that report with gh issue close REPORT_NUMBER
        --reason completed and add audit:closed with gh issue edit REPORT_NUMBER
        --add-label audit:closed. If any referenced issue is open or cannot be
        checked, leave that report unchanged. Print a summary of closed and
        skipped reports. Do not delete branches or perform any other GitHub
        actions. Never explore or read files outside the current repository
        root. Do not ask for confirmation.
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: audit-nothing
    name: "Idle: no open audit reports"
    command: echo
    commandArgs:
      - "Nothing to do, no open audit:report issues"
    silentChain: true
    onSuccessTaskId: null
    onFailureTaskId: null

diagram: |
  flowchart TD
      cleanupStart("Start<br/>Begin audit cleanup cycle") --> cleanupPreflight
      cleanupPreflight("Preflight<br/>Clean tree + sync main") -->|✓| cleanupSelect
      cleanupSelect["Select reports<br/>All open audit:report issues"] -->|✓| cleanupAi
      cleanupSelect -.->|✗| cleanupNothing
      cleanupAi(("Complete<br/>Close resolved audit reports"))
      cleanupNothing(("Idle<br/>No open audit reports"))
      classDef start fill:#ffffff,stroke:#172033,stroke-width:2px,color:#172033
      classDef action fill:#eef0ff,stroke:#554cff,stroke-width:2px,color:#172033
      classDef decision fill:#fff8e8,stroke:#c75b00,stroke-width:2px,color:#172033
      classDef idle fill:#202c40,stroke:#738198,stroke-width:2px,color:#ffffff
      classDef failure fill:#fff0f0,stroke:#ef2929,stroke-width:2px,color:#8b1a1a
      classDef success fill:#e8f8ec,stroke:#18883c,stroke-width:2px,color:#145a32
      class cleanupStart start
      class cleanupPreflight action
      class cleanupSelect decision
      class cleanupAi success
      class cleanupNothing idle
