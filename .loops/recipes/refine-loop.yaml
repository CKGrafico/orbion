version: 2

loops:
  - taskId: ref-pick
    intervalHuman: 20m
    description: "Refinement loop: pick issue, AI rewrite as user story, check answers, done"

tasks:
  - id: ref-pick
    name: "Select oldest refine:pick issue"
    command: sh
    commandArgs:
      - -c
      - >
        number=$(gh issue list --label "refine:pick" --state open
        --limit 1000 --json number
        --jq 'sort_by(.number) | .[0].number');
        test -n "$number" || exit 75;
        body=$(gh issue view "$number" --json number,title,body
        --jq '{number,title,body}');
        gh issue edit "$number" --add-label refine:doing
        --remove-label refine:pick >/dev/null;
        printf "%s\n" "$body"
    onSuccessTaskId: ref-refine
    onFailureTaskId: ref-nothing

  - id: ref-refine
    name: "AI: /plan-story to rewrite issue as grounded user story"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        First, load all skills available for your current agent. Then
        execute /plan-story for GitHub issue {{number}}. The feature to
        capture is: {{title}}. Context from the issue body: {{body}}. You
        must update the GitHub issue body yourself with the resulting user
        story (Mike Cohn As a/I want to/so that format, Gherkin
        Given/When/Then acceptance criteria, edge cases, and Mermaid diagram
        if appropriate). Ground the story in the actual codebase by reading
        relevant files. Never explore or read files outside the current
        repository root. Run @humanizer on the final prose to remove AI
        writing patterns. At the end, if you have clarifying questions for
        the product owner, append them to the issue body and add the label
        'refine:questions'. If the story is complete with no open questions,
        add label 'refine:done'. In either case, remove the 'refine:doing'
        label. Keep the final body as valid Markdown. Don't ask me anything
        during the session.
    onSuccessTaskId: ref-verify
    onFailureTaskId: ref-fail
    maxRuns: 5

  - id: ref-verify
    name: "Verify: issue has either refine:questions or refine:done label"
    command: sh
    commandArgs:
      - -c
      - >
        labels=$(gh issue view {{number}} --json labels
        --jq '.labels[].name');
        echo "$labels" | grep -qE 'refine:(questions|done)'
        && git checkout -- . && git clean -fd && exit 0 || exit 1
    onSuccessTaskId: null
    onFailureTaskId: ref-refine

  - id: ref-fail
    name: "Recovery: relabel issue back to refine:pick"
    command: sh
    commandArgs:
      - -c
      - "gh issue edit {{number}} --add-label refine:pick --remove-label refine:doing"
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: ref-nothing
    name: "No issues to refine"
    command: echo
    commandArgs:
      - "Nothing to refine, no issues with refine:pick label"
    silentChain: true
    onSuccessTaskId: null
    onFailureTaskId: null

diagram: |
  flowchart TD
      refStart("Start<br/>Begin refinement cycle") --> refPick
      refPick["Select<br/>Oldest refine:pick issue"] -->|✓| refRefine
      refPick -.->|✗| refNothing
      refRefine("Refine<br/>AI: /planStory to rewrite as user story<br/>↻5") -->|✓| refVerify
      refRefine -.->|✗| refFail
      refVerify["Verify<br/>Issue has refine:questions or refine:done"] -->|✓| refComplete
      refVerify -.->|✗| refRefine
      refComplete(("Complete<br/>Issue refined successfully"))
      refFail(("Fail<br/>Relabel issue back to refine:pick"))
      refNothing(("Idle<br/>No issues to refine"))
      classDef start fill:#ffffff,stroke:#172033,stroke-width:2px,color:#172033
      classDef action fill:#eef0ff,stroke:#554cff,stroke-width:2px,color:#172033
      classDef decision fill:#fff8e8,stroke:#c75b00,stroke-width:2px,color:#172033
      classDef idle fill:#202c40,stroke:#738198,stroke-width:2px,color:#ffffff
      classDef failure fill:#fff0f0,stroke:#ef2929,stroke-width:2px,color:#8b1a1a
      classDef success fill:#e8f8ec,stroke:#18883c,stroke-width:2px,color:#145a32
      class refStart start
      class refRefine action
      class refPick,refVerify decision
      class refNothing idle
      class refFail failure
      class refComplete success
