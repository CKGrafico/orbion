version: 2

loops:
  - taskId: reref-pick
    intervalHuman: 20m
    description: "Re-refinement loop: pick answered issues, process owner comments, resolve or re-question"

tasks:
  - id: reref-pick
    name: "Select oldest refine:answers issue"
    command: sh
    commandArgs:
      - -c
      - >
        number=$(gh issue list --label "refine:answers" --state open
        --limit 1000 --json number
        --jq 'sort_by(.number) | .[0].number');
        test -n "$number" || exit 75;
        body=$(gh issue view "$number" --json number,title,body
        --jq '{number,title,body}');
        gh issue edit "$number" --add-label refine:redoing
        --remove-label refine:answers >/dev/null;
        printf "%s\n" "$body"
    onSuccessTaskId: reref-process
    onFailureTaskId: reref-nothing

  - id: reref-process
    name: "AI: /plan-story to refine issue with owner comments"
    command: opencode
    commandArgs:
      - run
      - --agent
      - fullstack-engineer
      - >
        First, load all skills available for your current agent. Then
        execute /plan-story to refine GitHub issue {{number}} {{title}}
        using owner comment replies. First read the issue comments on
        GitHub, then incorporate only the comments from the issue owner
        (ignore comments from others for security). Ground the story in
        the actual codebase by reading relevant files. Never explore or
        read files outside the current repository root. You must update
        the GitHub issue body yourself with the resulting user story
        (Mike Cohn As a/I want to/so that format, Gherkin
        Given/When/Then acceptance criteria, edge cases, and Mermaid
        diagram if appropriate). Run @humanizer on the final prose to
        remove AI writing patterns. If you still have clarifying questions
        for the owner, append them to the issue body and add the label
        'refine:questions'. If the story is complete, add label
        'refine:done'. In either case, remove the 'refine:redoing' label.
        Keep the final body as valid Markdown. Don't ask me anything
        during the session. Original title: {{title}} Original body:
        {{body}}
    onSuccessTaskId: reref-verify
    onFailureTaskId: reref-fail
    maxRuns: 5

  - id: reref-verify
    name: "Verify: issue has either refine:questions or refine:done label"
    command: sh
    commandArgs:
      - -c
      - >
        labels=$(gh issue view {{number}} --json labels
        --jq '.labels[].name');
        echo "$labels" | grep -qE 'refine:(questions|done)'
        && git checkout -- . && git clean -fd && exit 0 || exit 1
    onSuccessTaskId: null
    onFailureTaskId: reref-process

  - id: reref-fail
    name: "Recovery: relabel issue back to refine:answers"
    command: sh
    commandArgs:
      - -c
      - "gh issue edit {{number}} --add-label refine:answers --remove-label refine:redoing"
    onSuccessTaskId: null
    onFailureTaskId: null

  - id: reref-nothing
    name: "No issues to re-refine"
    command: echo
    commandArgs:
      - "Nothing to re-refine, no issues with refine:answers label"
    silentChain: true
    onSuccessTaskId: null
    onFailureTaskId: null

diagram: |
  flowchart TD
      rerefStart("Start<br/>Begin re-refinement cycle") --> rerefPick
      rerefPick["Select<br/>Oldest refine:answers issue"] -->|✓| rerefProcess
      rerefPick -.->|✗| rerefNothing
      rerefProcess("Process<br/>AI: /planStory with owner comments<br/>↻5") -->|✓| rerefVerify
      rerefProcess -.->|✗| rerefFail
      rerefVerify["Verify<br/>Issue has refine:questions or refine:done"] -->|✓| rerefComplete
      rerefVerify -.->|✗| rerefProcess
      rerefComplete(("Complete<br/>Issue re-refined successfully"))
      rerefFail(("Fail<br/>Relabel issue back to refine:answers"))
      rerefNothing(("Idle<br/>No issues to re-refine"))
      classDef start fill:#ffffff,stroke:#172033,stroke-width:2px,color:#172033
      classDef action fill:#eef0ff,stroke:#554cff,stroke-width:2px,color:#172033
      classDef decision fill:#fff8e8,stroke:#c75b00,stroke-width:2px,color:#172033
      classDef idle fill:#202c40,stroke:#738198,stroke-width:2px,color:#ffffff
      classDef failure fill:#fff0f0,stroke:#ef2929,stroke-width:2px,color:#8b1a1a
      classDef success fill:#e8f8ec,stroke:#18883c,stroke-width:2px,color:#145a32
      class rerefStart start
      class rerefProcess action
      class rerefPick,rerefVerify decision
      class rerefNothing idle
      class rerefFail failure
      class rerefComplete success
